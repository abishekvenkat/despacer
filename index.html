<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>despacer</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #faf9f7;
    --text: #2c2c2c;
    --text-muted: #8a8680;
    --border: #e4e0db;
    --code-bg: #f0eee9;
    --accent: #7a6e5e;
    --mono: 'IBM Plex Mono', 'SFMono-Regular', monospace;
  }

  html, body {
    height: 100%;
    font-family: var(--mono);
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: flex;
    flex-direction: column;
    padding: 1.5rem;
    gap: 0.75rem;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  h1 {
    font-size: 0.78rem;
    font-weight: 500;
    color: var(--text-muted);
    letter-spacing: 0.04em;
  }

  .btn-row {
    display: flex;
    gap: 0.4rem;
  }

  button {
    font-family: var(--mono);
    font-size: 0.72rem;
    color: var(--text-muted);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.45em 0.9em;
    cursor: pointer;
    letter-spacing: 0.02em;
    transition: color 0.15s, border-color 0.15s;
  }

  button:hover {
    color: var(--text);
    border-color: var(--accent);
  }

  button.primary {
    color: var(--bg);
    background: var(--accent);
    border-color: var(--accent);
  }

  button.primary:hover {
    background: var(--text);
    border-color: var(--text);
  }

  button.copied {
    color: var(--text-muted);
    border-color: var(--border);
  }

  textarea {
    flex: 1;
    width: 100%;
    font-family: var(--mono);
    font-size: 0.82rem;
    line-height: 1.6;
    color: var(--text);
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1rem 1.2rem;
    resize: none;
    outline: none;
    transition: border-color 0.15s;
  }

  textarea:focus {
    border-color: var(--accent);
  }

  textarea::placeholder {
    color: var(--text-muted);
    opacity: 0.6;
  }
</style>
</head>
<body>

<header>
  <h1>despacer</h1>
  <div class="btn-row">
    <button id="sample-btn">sample</button>
    <button id="clear-btn">clear</button>
    <button id="copy-btn">copy</button>
    <button id="save-btn">save as</button>
    <button id="despace-btn" class="primary">despace</button>
  </div>
</header>

<textarea id="input" placeholder="paste terminal output here..." spellcheck="false"></textarea>

<script>
  const input = document.getElementById('input');
  const despaceBtn = document.getElementById('despace-btn');
  const copyBtn = document.getElementById('copy-btn');
  const clearBtn = document.getElementById('clear-btn');
  const sampleBtn = document.getElementById('sample-btn');
  const saveBtn = document.getElementById('save-btn');

  const SAMPLE = `Deployment Summary
  Service: api-gateway v2.4.1
  Environment: production

  The build completed in 3m 42s. All 147 unit tests passed and the integration suite
  finished without failures. The canary rollout reached 10% of traffic and latency
  metrics remained within baseline thresholds for the full observation window.

  ---
  Changes in this release
  - Added rate limiting middleware with per-client token bucket configuration
  - Fixed a memory leak in the connection pool that caused gradual RSS growth over
    48-hour periods
  - Updated the JWT validation library from 3.1.0 to 3.2.4 to address CVE-2024-8821

  ---
  Rollback instructions
  If the deployment needs to be reverted, run the rollback script with the previous
  version tag. The database migration in this release is backwards-compatible, so no
  schema changes are required. Monitor the error rate dashboard for at least 15 minutes
  after rollback to confirm stability.`;

  function despace(text) {
    const lines = text.split('\n').map(l => l.trim());
    const out = [];
    let i = 0;

    while (i < lines.length) {
      const line = lines[i];

      if (line === '') {
        out.push('');
        i++;
        continue;
      }

      // Separators, list items, headings — pass through unchanged
      const isSpecial = line === '---' || /^[-*+]\s/.test(line) || /^#+\s/.test(line) || /^\d+\.\s/.test(line);
      if (isSpecial) {
        out.push(line);
        i++;
        continue;
      }

      // Rejoin soft-wrapped lines: if a line doesn't end with sentence-terminating
      // punctuation, it was likely wrapped by the terminal — merge with next line
      let joined = line;
      while (i + 1 < lines.length) {
        const next = lines[i + 1];
        if (next === '' || next === '---' || /^[-*+]\s/.test(next) || /^#+\s/.test(next)) break;
        if (!/[.?!:]$/.test(joined)) {
          joined += ' ' + next;
          i++;
        } else {
          break;
        }
      }

      out.push(joined);
      i++;
    }

    return out.join('\n');
  }

  despaceBtn.addEventListener('click', () => {
    input.value = despace(input.value);
  });

  sampleBtn.addEventListener('click', () => {
    input.value = SAMPLE;
    input.focus();
  });

  clearBtn.addEventListener('click', () => {
    input.value = '';
    input.focus();
  });

  saveBtn.addEventListener('click', async () => {
    if (!input.value) return;
    const filename = `despaced-${new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-')}.txt`;

    if (window.showSaveFilePicker) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: filename,
          types: [{ description: 'Text file', accept: { 'text/plain': ['.txt', '.md'] } }],
        });
        const writable = await handle.createWritable();
        await writable.write(input.value);
        await writable.close();
      } catch (_) { /* cancelled */ }
    } else {
      const blob = new Blob([input.value], { type: 'text/plain' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      a.click();
      URL.revokeObjectURL(a.href);
    }
  });

  copyBtn.addEventListener('click', () => {
    if (!input.value) return;
    navigator.clipboard.writeText(input.value).then(() => {
      copyBtn.textContent = 'copied!';
      copyBtn.classList.add('copied');
      setTimeout(() => {
        copyBtn.textContent = 'copy';
        copyBtn.classList.remove('copied');
      }, 1500);
    });
  });
</script>

</body>
</html>
